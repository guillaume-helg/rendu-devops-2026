# Production values — overrides values.yaml defaults
# Usage: helm install miage-bank ./miage-bank -f values.yaml -f values-prod.yaml

# -- Higher replica count for production availability
replicaCount: 3

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: miage-bank.production.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  # -- Prod gets more headroom for traffic spikes
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  # -- HPA enabled in production, scales 3→10 pods based on CPU
  enabled: true
  minReplicas: 3
  maxReplicas: 10

# -- Non-sensitive application configuration injected via ConfigMap
config:
  springProfile: "prod"

vault:
  # -- Production secrets are stored in a separate Vault path
  secretPath: "secret/data/miage-bank-prod"
