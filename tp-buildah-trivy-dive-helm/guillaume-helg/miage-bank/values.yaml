# -- Number of pod replicas for the backend deployment (dev: 1)
replicaCount: 1

image:
  # -- Container registry + image name (GHCR published by CI)
  repository: ghcr.io/guillaume-helg/miage-bank-backend
  # -- Image pull policy (IfNotPresent avoids re-pulling on every restart)
  pullPolicy: IfNotPresent
  # -- Image tag; overridden by CI with the Git SHA or semver tag
  tag: "latest"

serviceAccount:
  # -- Whether to create a dedicated ServiceAccount for the app
  create: true
  # -- Name of the ServiceAccount referenced in the Deployment
  name: "miage-bank-sa"

service:
  # -- Service type. ClusterIP only — external access is via Ingress
  type: ClusterIP
  # -- Port exposed by the Service (matches Spring Boot server.port)
  port: 8080

ingress:
  # -- Enable/disable the Ingress resource
  enabled: true
  # -- IngressClass to use (Traefik controller)
  className: "traefik"
  hosts:
    - host: miage-bank.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  # -- Hard upper bounds — pod is OOMKilled / CPU-throttled beyond these
  limits:
    cpu: 500m
    memory: 512Mi
  # -- Scheduler guarantees — used for bin-packing pods onto nodes
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  # -- Enable HPA (Horizontal Pod Autoscaler). Disabled in dev.
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# -- Non-sensitive application configuration injected via ConfigMap
config:
  # -- Spring Boot active profile
  springProfile: "default"
  # -- Arbitrary extra environment variables (key: value map)
  extra: {}

vault:
  # -- Path in Vault KV v2 where MIAGE-Bank secrets are stored
  secretPath: "secret/data/miage-bank"
