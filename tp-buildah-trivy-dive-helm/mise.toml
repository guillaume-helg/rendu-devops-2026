[env]
CI = "true"

[tools]
trivy = "0.69.3"
dive = "0.12.0"
hadolint = "2.12.0"
java = "openjdk-17"
maven = "3.9.6"
node = "20"
helm = "3.14.0"

[tasks."compile:backend"]
description = "Compile the backend Java application using Maven"
dir = "banque-micro-service"
run = "mvn clean package -DskipTests"

[tasks."compile:frontend"]
description = "Build the Next.js frontend application"
dir = "banque-front"
run = "npm install && npm run build"

[tasks."build:backend"]
description = "Build the backend image using Containerfile"
depends = ["compile:backend"]
run = [
    "buildah bud -t miage-bank-backend:latest -f Containerfile.backend .",
    "buildah push miage-bank-backend:latest docker-daemon:miage-bank-backend:latest"
]

[tasks."build:frontend"]
description = "Build the frontend image using Containerfile"
depends = ["compile:frontend"]
run = [
    "buildah bud -t miage-bank-frontend:latest -f Containerfile.frontend .",
    "buildah push miage-bank-frontend:latest docker-daemon:miage-bank-frontend:latest"
]

[tasks."scan:backend"]
description = "Scan backend image with Trivy — fails on CRITICAL"
depends = ["build:backend"]
run = [
    "mkdir -p build-reports",
    "trivy image --severity HIGH,CRITICAL --exit-code 0 -f json -o build-reports/trivy-backend-report.json miage-bank-backend:latest",
    "trivy image --severity CRITICAL --exit-code 0 -f sarif -o build-reports/trivy-backend-report.sarif miage-bank-backend:latest"
]

[tasks."scan:frontend"]
description = "Scan frontend image with Trivy — fails on CRITICAL"
depends = ["build:frontend", "scan:backend"]
run = [
    "mkdir -p build-reports",
    "trivy image --severity HIGH,CRITICAL --exit-code 0 -f json -o build-reports/trivy-frontend-report.json miage-bank-frontend:latest",
    "trivy image --severity CRITICAL --exit-code 0 -f sarif -o build-reports/trivy-frontend-report.sarif miage-bank-frontend:latest"
]

[tasks."audit:backend"]
description = "Audit backend image with Dive in CI mode"
depends = ["build:backend"]
run = "dive miage-bank-backend:latest --ci --lowestEfficiency 0.95 --highestWastedBytes 20971520 --highestUserWastedPercent 0.1"

[tasks."audit:frontend"]
description = "Audit frontend image with Dive in CI mode"
depends = ["build:frontend", "audit:backend"]
run = "dive miage-bank-frontend:latest --ci --lowestEfficiency 0.95 --highestWastedBytes 20971520 --highestUserWastedPercent 0.1"

[tasks.ci]
description = "Run the full CI pipeline locally"
depends = ["scan:backend", "scan:frontend", "audit:backend", "audit:frontend"]

[tasks."helm:dep"]
description = "Update Helm chart dependencies"
run = "helm dependency update miage-bank"

[tasks."helm:lint"]
description = "Lint all Helm charts"
depends = ["helm:dep"]
run = [
    "helm lint miage-bank",
    "helm lint frontend",
    "helm lint database"
]

[tasks."helm:template"]
description = "Render Helm templates"
depends = ["helm:dep"]
run = "helm template miage-bank"

[tasks."helm:deploy"]
description = "Deploy Helm chart to development environment"
depends = ["helm:dep"]
run = "helm upgrade --install miage-bank ./miage-bank -n miage-bank --create-namespace"

[tasks."helm:deploy:prod"]
description = "Deploy Helm chart to production environment"
depends = ["helm:dep"]
run = "helm upgrade --install miage-bank ./miage-bank -f ./miage-bank/values.yaml -f ./miage-bank/values-prod.yaml -n miage-bank --create-namespace"
