[env]
CI = "true"

[tools]
trivy = "0.69.3"
dive = "0.12.0"
hadolint = "2.12.0"
java = "openjdk-17"
maven = "3.9.6"
node = "20"
helm = "3.14.0"

[tasks."compile:backend"]
description = "Compile all microservices using Maven parent POM"
dir = "banque-micro-service"
run = "mvn -f pom-parent.xml clean package -DskipTests"

[tasks."compile:frontend"]
description = "Build the Next.js frontend application"
dir = "banque-front"
run = "npm install && npm run build"

[tasks."build:backend"]
description = "Build the 8 backend microservices using Buildah"
depends = ["compile:backend"]
run = [
    "buildah bud -t miage-bank-discovery:latest -f banque-micro-service/discovery-service/Dockerfile banque-micro-service/discovery-service",
    "buildah push miage-bank-discovery:latest docker-daemon:miage-bank-discovery:latest",
    "buildah bud -t miage-bank-config:latest -f banque-micro-service/config-service/Dockerfile banque-micro-service/config-service",
    "buildah push miage-bank-config:latest docker-daemon:miage-bank-config:latest",
    "buildah bud -t miage-bank-gateway:latest -f banque-micro-service/gateway-service/Dockerfile banque-micro-service/gateway-service",
    "buildah push miage-bank-gateway:latest docker-daemon:miage-bank-gateway:latest",
    "buildah bud -t miage-bank-customer:latest -f banque-micro-service/customer-service/Dockerfile banque-micro-service/customer-service",
    "buildah push miage-bank-customer:latest docker-daemon:miage-bank-customer:latest",
    "buildah bud -t miage-bank-account:latest -f banque-micro-service/account-service/Dockerfile banque-micro-service/account-service",
    "buildah push miage-bank-account:latest docker-daemon:miage-bank-account:latest",
    "buildah bud -t miage-bank-composite:latest -f banque-micro-service/composite-service/Dockerfile banque-micro-service/composite-service",
    "buildah push miage-bank-composite:latest docker-daemon:miage-bank-composite:latest",
    "buildah bud -t miage-bank-monitoring:latest -f banque-micro-service/monitoring-service/Dockerfile banque-micro-service/monitoring-service",
    "buildah push miage-bank-monitoring:latest docker-daemon:miage-bank-monitoring:latest",
    "buildah bud -t miage-bank-main:latest -f banque-micro-service/Dockerfile banque-micro-service",
    "buildah push miage-bank-main:latest docker-daemon:miage-bank-main:latest"
]

[tasks."build:frontend"]
description = "Build the frontend image using Containerfile"
depends = ["compile:frontend"]
run = [
    "buildah bud -t miage-bank-frontend:latest -f Containerfile.frontend .",
    "buildah push miage-bank-frontend:latest docker-daemon:miage-bank-frontend:latest"
]

[tasks."scan:backend"]
description = "Scan gateway image with Trivy — vulnerabilities and secrets"
depends = ["build:backend"]
run = [
    "mkdir -p build-reports",
    "trivy image --severity HIGH,CRITICAL --scanners vuln,secret --exit-code 0 -f json -o build-reports/trivy-backend-report.json miage-bank-gateway:latest",
    "trivy image --severity CRITICAL --scanners vuln,secret --exit-code 0 -f sarif -o build-reports/trivy-backend-report.sarif miage-bank-gateway:latest"
]

[tasks."scan:frontend"]
description = "Scan frontend image with Trivy — vulnerabilities and secrets"
depends = ["build:frontend", "scan:backend"]
run = [
    "mkdir -p build-reports",
    "trivy image --severity HIGH,CRITICAL --scanners vuln,secret --exit-code 0 -f json -o build-reports/trivy-frontend-report.json miage-bank-frontend:latest",
    "trivy image --severity CRITICAL --scanners vuln,secret --exit-code 0 -f sarif -o build-reports/trivy-frontend-report.sarif miage-bank-frontend:latest"
]

[tasks."audit:backend"]
description = "Audit API gateway image with Dive in CI mode"
depends = ["build:backend"]
run = "dive miage-bank-gateway:latest --ci --lowestEfficiency 0.95 --highestWastedBytes 20971520 --highestUserWastedPercent 0.1"

[tasks."audit:frontend"]
description = "Audit frontend image with Dive in CI mode"
depends = ["build:frontend", "audit:backend"]
run = "dive miage-bank-frontend:latest --ci --lowestEfficiency 0.95 --highestWastedBytes 20971520 --highestUserWastedPercent 0.1"

[tasks.ci]
description = "Run the full CI pipeline locally"
depends = ["scan:backend", "scan:frontend", "audit:backend", "audit:frontend"]

[tasks."helm:dep"]
description = "Update Helm chart dependencies"
run = "helm dependency update miage-bank"

[tasks."helm:lint"]
description = "Lint all Helm charts"
depends = ["helm:dep"]
run = [
    "helm lint miage-bank",
    "helm lint frontend",
    "helm lint database"
]

[tasks."helm:template"]
description = "Render Helm templates"
depends = ["helm:dep"]
run = "helm template miage-bank"

[tasks."helm:deploy"]
description = "Deploy Helm chart to development environment"
depends = ["helm:dep"]
run = "helm upgrade --install miage-bank ./miage-bank -n miage-bank --create-namespace"

[tasks."helm:deploy:prod"]
description = "Deploy Helm chart to production environment"
depends = ["helm:dep"]
run = "helm upgrade --install miage-bank ./miage-bank -f ./miage-bank/values.yaml -f ./miage-bank/values-prod.yaml -n miage-bank --create-namespace"
