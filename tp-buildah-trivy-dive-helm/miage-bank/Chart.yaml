apiVersion: v2
name: miage-bank
description: A Helm chart for Kubernetes deployment of MIAGE-Bank
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: frontend
    version: 0.1.0
    repository: "file://../frontend"
    condition: frontend.enabled
  - name: database
    version: 0.1.0
    repository: "file://../database"
    alias: mysql
    condition: mysql.enabled

