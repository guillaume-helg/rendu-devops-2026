ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: miage-bank.local

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/guillaume-helg/miage-bank-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  config:
    springProfile: "default"
    extra: {}
  vault:
    secretPath: "secret/data/miage-bank"

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/guillaume-helg/miage-bank-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  rootPassword: "root"
  database: "test"
  persistence:
    enabled: true
    storageClass: "standard"
    size: 1Gi

serviceAccount:
  create: true
  name: "miage-bank-sa"
