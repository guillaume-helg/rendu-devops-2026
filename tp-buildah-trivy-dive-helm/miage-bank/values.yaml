ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: miage-bank.local

discovery:
  image:
    repository: ghcr.io/guillaume-helg/miage-bank-discovery
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

config:
  image:
    repository: ghcr.io/guillaume-helg/miage-bank-config
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

gateway:
  image:
    repository: ghcr.io/guillaume-helg/miage-bank-gateway
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

customer:
  image:
    repository: ghcr.io/guillaume-helg/miage-bank-customer
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

account:
  image:
    repository: ghcr.io/guillaume-helg/miage-bank-account
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

composite:
  image:
    repository: ghcr.io/guillaume-helg/miage-bank-composite
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/guillaume-helg/miage-bank-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  rootPassword: ${MYSQL_ROOT_PASSWORD}
  database: ${MYSQL_DATABASE}
  persistence:
    enabled: true
    storageClass: "standard"
    size: 1Gi

serviceAccount:
  create: true
  name: "miage-bank-sa"

vault:
  secretPath: "secret/data/miage-bank"
