ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: miage-bank.production.local

backend:
  replicaCount: 3
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
  config:
    springProfile: "prod"
  vault:
    secretPath: "secret/data/miage-bank-prod"

frontend:
  enabled: true
  replicaCount: 3
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10

mysql:
  enabled: true
  persistence:
    size: 5Gi
