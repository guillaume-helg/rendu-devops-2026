replicaCount: 3

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: miage-bank.production.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
config:
  springProfile: "prod"

vault:
  secretPath: "secret/data/miage-bank-prod"
