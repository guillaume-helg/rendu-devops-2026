apiVersion: v1
kind: Service
metadata:
  name: {{ include "miage-bank.fullname" . }}-monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "miage-bank.selectorLabels" . | nindent 4 }}
    component: monitoring
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "miage-bank.selectorLabels" . | nindent 4 }}
    component: monitoring
