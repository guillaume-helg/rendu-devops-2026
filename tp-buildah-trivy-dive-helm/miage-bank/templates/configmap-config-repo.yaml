apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "miage-bank.fullname" . }}-config-repo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "miage-bank.selectorLabels" . | nindent 4 }}
data:
  account-service.yml: |
    spring:
      data:
        mongodb:
          uri: mongodb://localhost:27017/account_db
    eureka:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka/
      instance:
        prefer-ip-address: true

  composite-service.yml: |
    eureka:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka/
      instance:
        prefer-ip-address: true

  customer-service.yml: |
    spring:
      datasource:
        url: jdbc:mysql://localhost:3306/customer_db?createDatabaseIfNotExist=true
        username: root
        password: password
      jpa:
        hibernate:
          ddl-auto: update
        show-sql: true
    eureka:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka/
      instance:
        prefer-ip-address: true

  gateway-service.yml: |
    spring:
      cloud:
        gateway:
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/clients/**
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/comptes/**
            - id: composite-service
              uri: lb://composite-service
              predicates:
                - Path=/api/composite/**
            - id: auth-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/auth/**
    eureka:
      client:
        service-url:
          defaultZone: http://discovery-service:8761/eureka/
      instance:
        prefer-ip-address: true
