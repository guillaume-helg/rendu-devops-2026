# Ingress: Default deny all incoming traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Egress: Default deny all outbound traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
# Egress: Allow DNS resolution for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
# Ingress: Allow Traefik/Nginx Ingress Controller to reach frontend and gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 3000
---
# NetworkPolicy: Allow all services to reach discovery-service (Eureka)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-discovery-traffic
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: miage-bank
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: miage-bank
    ports:
    - protocol: TCP
      port: 8761
  egress:
  - to:
    - podSelector:
        matchLabels:
          component: discovery
    ports:
    - protocol: TCP
      port: 8761
---
# NetworkPolicy: Allow all services to reach config-service (Config Server)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-config-traffic
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: miage-bank
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: miage-bank
    ports:
    - protocol: TCP
      port: 8888
  egress:
  - to:
    - podSelector:
        matchLabels:
          component: config
    ports:
    - protocol: TCP
      port: 8888
---
# NetworkPolicy: Allow gateway to talk to business services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: gateway
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          component: customer
    ports:
    - protocol: TCP
      port: 8081
  - to:
    - podSelector:
        matchLabels:
          component: account
    ports:
    - protocol: TCP
      port: 8082
  - to:
    - podSelector:
        matchLabels:
          component: composite
    ports:
    - protocol: TCP
      port: 8083
---
# NetworkPolicy: Allow gateway ingress on port 8080 from Ingress or Frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    - podSelector:
        matchLabels:
          component: frontend
    ports:
    - protocol: TCP
      port: 8080
---
# NetworkPolicy: Allow frontend egress to gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress-to-gateway
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: frontend
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          component: gateway
    ports:
    - protocol: TCP
      port: 8080
---
# NetworkPolicy: Allow composite to talk to customer and account
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-composite-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: composite
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          component: customer
    ports:
    - protocol: TCP
      port: 8081
  - to:
    - podSelector:
        matchLabels:
          component: account
    ports:
    - protocol: TCP
      port: 8082
---
# NetworkPolicy: Allow composite ingress on port 8083 from gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-composite-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: composite
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: gateway
    ports:
    - protocol: TCP
      port: 8083
---
# NetworkPolicy: Allow business services to receive traffic from gateway or composite
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-business-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: miage-bank
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: gateway
    - podSelector:
        matchLabels:
          component: composite
    ports:
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082
---
# NetworkPolicy: Allow customer-service to call MySQL database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-customer-to-mysql
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: customer
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          component: mysql
    ports:
    - protocol: TCP
      port: 3306
---
# NetworkPolicy: Allow MySQL to receive ingress from customer-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-ingress-from-customer
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: mysql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: customer
    ports:
    - protocol: TCP
      port: 3306
---
# NetworkPolicy: Allow account-service to call MongoDB database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-account-to-mongodb
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: account
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          component: mongodb
    ports:
    - protocol: TCP
      port: 27017
---
# NetworkPolicy: Allow MongoDB to receive ingress from account-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-ingress-from-account
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: mongodb
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: account
    ports:
    - protocol: TCP
      port: 27017
