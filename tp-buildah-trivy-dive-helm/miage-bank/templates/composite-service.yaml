apiVersion: v1
kind: Service
metadata:
  name: {{ include "miage-bank.fullname" . }}-composite
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "miage-bank.selectorLabels" . | nindent 4 }}
    component: composite
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "miage-bank.selectorLabels" . | nindent 4 }}
    component: composite
