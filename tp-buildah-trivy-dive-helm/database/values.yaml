mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  rootPassword: ${MYSQL_ROOT_PASSWORD}
  database: ${MYSQL_DATABASE}
  persistence:
    enabled: true
    storageClass: "standard"
    size: 1Gi

mongodb:
  image:
    repository: mongo
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 27017
  persistence:
    enabled: true
    storageClass: "standard"
    size: 1Gi

serviceAccount:
  create: true
  name: "database-sa"

backup:
  enabled: false
  schedule: "0 2 * * *"  # Daily at 2 AM
  storageClass: "standard"
  size: 10Gi
