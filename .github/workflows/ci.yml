name: CI Build OCI Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-scan-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Checkout Backend
      uses: actions/checkout@v4
      with:
        repository: guillaume-helg/banque-micro-service
        path: tp-buildah-trivy-dive-helm/banque-micro-service

    - name: Checkout Frontend
      uses: actions/checkout@v4
      with:
        repository: guillaume-helg/banque-front
        path: tp-buildah-trivy-dive-helm/banque-front

    - name: Set up mise
      uses: jdx/mise-action@v2
      with:
        cache: true

    - name: Run Hadolint (Backend)
      working-directory: tp-buildah-trivy-dive-helm
      run: mise exec hadolint -- hadolint Containerfile.backend

    - name: Run Hadolint (Frontend)
      working-directory: tp-buildah-trivy-dive-helm
      run: mise exec hadolint -- hadolint Containerfile.frontend

    - name: Run CI Pipeline (mise)
      working-directory: tp-buildah-trivy-dive-helm
      run: mise run ci

    - name: Run Helm Lint (mise)
      working-directory: tp-buildah-trivy-dive-helm
      run: mise run helm:lint

    - name: Push images to GHCR
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      env:
        REGISTRY: ghcr.io/${{ github.repository_owner }}
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | buildah login -u "${{ github.actor }}" --password-stdin ghcr.io
        for img in miage-bank-discovery miage-bank-config miage-bank-gateway miage-bank-customer miage-bank-account miage-bank-composite miage-bank-frontend; do
          buildah tag ${img}:latest $REGISTRY/${img}:${{ github.sha }}
          buildah tag ${img}:latest $REGISTRY/${img}:latest
          buildah push $REGISTRY/${img}:${{ github.sha }}
          buildah push $REGISTRY/${img}:latest
        done

    - name: Upload Trivy Results (Backend SARIF) for Security Tab
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: tp-buildah-trivy-dive-helm/build-reports/trivy-backend-report.sarif

    - name: Upload Trivy Results (Frontend SARIF) for Security Tab
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: tp-buildah-trivy-dive-helm/build-reports/trivy-frontend-report.sarif

    - name: Publish artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: tp-buildah-trivy-dive-helm/build-reports/
